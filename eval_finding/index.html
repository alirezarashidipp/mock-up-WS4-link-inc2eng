<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b242a">
  <title>Finding evaluator · WS4</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182229; --muted: #505f66; --line: #cdd5d6; --paper: #fff;
      --canvas: #f4f6f5; --dark: #1b242a; --red: #c90018; --soft: #edf1f0;
      --green: #176343; --amber: #865113; --mono: Consolas, "Courier New", monospace;
      font: 16px/1.45 "Inter", "Segoe UI", Arial, sans-serif; color: var(--ink);
    }
    * { box-sizing: border-box; }
    body { background: var(--canvas); margin: 0; }
    [hidden] { display: none !important; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    :focus-visible { outline: 3px solid #4499cc; outline-offset: 3px; }
    h1, h2, p { margin: 0; }
    .wrap { width: min(1370px, 92%); margin-inline: auto; }
    header { background: var(--paper); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 14px; height: 56px; font-size: 14px; font-weight: 600; }
    .brand strong { font-size: 21px; letter-spacing: -.06em; }
    .brand span:last-child { border-left: 1px solid var(--line); padding-left: 14px; }
    .brand-mark { position: relative; width: 22px; height: 20px; }
    .brand-mark::before, .brand-mark::after { content: ""; position: absolute; width: 8px; background: var(--red); transform: skewX(-28deg); }
    .brand-mark::before { height: 14px; top: 4px; left: 2px; }
    .brand-mark::after { height: 20px; left: 12px; }
    main { padding-block: 23px 35px; }
    .search { background: var(--dark); color: white; padding: 25px 30px 23px; border-top: 3px solid var(--red); }
    h1 { font-size: clamp(29px, 3vw, 45px); line-height: 1.08; font-weight: 620; letter-spacing: -.052em; margin-bottom: 18px; }
    .form-label, thead th { font-size: 11px; font-weight: 650; letter-spacing: .085em; text-transform: uppercase; }
    .form-label { display: block; color: #d2dadd; margin-bottom: 6px; }
    .search-row { display: flex; gap: 9px; }
    #supplier { background: white; color: var(--ink); min-width: 0; flex: 1; border: 1px solid #dae1e3; padding: 10px 13px; border-radius: 2px; font-size: 18px; }
    #supplier::placeholder { color: #68767c; }
    .run { display: inline-flex; align-items: center; justify-content: center; gap: 15px; min-width: 145px; border: 1px solid var(--red); border-radius: 2px; background: var(--red); color: white; font-size: 14px; font-weight: 650; padding: 10px 17px; }
    .run:enabled:hover { background: #ab0014; }
    .reference { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 12px; min-height: 30px; color: #e0e5e7; font-size: 13px; }
    .reference b { color: #d2dadd; font-weight: 500; }
    #source-name { font-family: var(--mono); overflow-wrap: anywhere; }
    .source-options { display: inline-block; }
    .source-options summary { cursor: pointer; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
    .source-options[open] summary { margin-bottom: 4px; }
    .file-action { padding: 3px 8px; border: 1px solid #758188; background: transparent; color: white; border-radius: 2px; font-size: 12px; font-weight: 600; }
    .file-action:hover { background: #36454c; }
    .results { border: 1px solid var(--line); background: var(--paper); margin-top: 18px; }
    .results-header { padding: 17px 23px; display: flex; flex-wrap: wrap; gap: 9px 18px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .title-line { display: flex; align-items: center; gap: 12px; }
    h2 { font-size: 23px; font-weight: 620; letter-spacing: -.035em; }
    #status-tag { border-left: 2px solid var(--line); color: var(--muted); padding: 2px 0 2px 9px; font: 650 12px var(--mono); }
    #status-tag[data-status="MATCHED"] { color: var(--green); border-color: var(--green); }
    #status-tag[data-status="INVALID_NAME"] { color: var(--amber); border-color: var(--amber); }
    .views { display: flex; border: 1px solid var(--line); padding: 2px; gap: 2px; }
    .views button, .page-button { background: white; color: var(--ink); border: 0; font-size: 13px; font-weight: 600; padding: 5px 10px; }
    .views button[aria-pressed="true"] { color: white; background: var(--dark); }
    .views button[aria-pressed="false"]:hover, .page-button:enabled:hover { background: var(--soft); }
    .notice, .query-meta { margin: 0; padding: 15px 23px; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
    .notice { min-height: 62px; }
    .notice.error { color: #990017; }
    .query-meta { border-bottom: 1px solid var(--line); padding-block: 9px; }
    .table-window { overflow: auto; max-height: min(55vh, 650px); }
    table { width: 100%; text-align: left; font-size: 14px; border-collapse: separate; border-spacing: 0; }
    th, td { padding: 10px 13px; border-bottom: 1px solid var(--line); }
    thead th { position: sticky; top: 0; z-index: 1; background: var(--soft); color: var(--muted); white-space: nowrap; }
    td { vertical-align: top; white-space: pre-wrap; overflow-wrap: anywhere; }
    .raw thead th { font: 600 12px var(--mono); letter-spacing: 0; text-transform: none; }
    .raw td { min-width: 12ch; max-width: 54ch; }
    .summary td:nth-child(2) { font-weight: 600; }
    .summary td:nth-child(n+3) { font: 13px/1.4 var(--mono); }
    .summary td:nth-child(3) { color: var(--green); }
    .page-bar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 8px 15px; border-top: 1px solid var(--line); }
    .page-bar span { font-size: 12px; color: var(--muted); }
    .page-button { border: 1px solid var(--line); }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <header><div class="brand wrap"><i aria-hidden="true" class="brand-mark"></i><strong>WS4</strong><span>Finding evaluator</span></div></header>
  <main class="wrap">
    <form id="form" class="search">
      <h1>Find engagements</h1>
      <label for="supplier" class="form-label">Supplier name</label>
      <div class="search-row">
        <input id="supplier" name="supplier_name" autocomplete="off" placeholder="e.g. Cisco" enterkeyhint="search" autofocus required>
        <button id="run" class="run" type="submit" disabled><span>Run Finding</span><span aria-hidden="true">→</span></button>
      </div>
      <div class="reference">
        <b>Reference</b><span id="source-name">data/input/ENG_ALL.csv</span>
        <details id="source-options" class="source-options">
          <summary>Change reference</summary>
          <button id="pick" class="file-action" type="button">Choose CSV</button>
          <button id="reset-file" class="file-action" type="button" hidden>Use project file</button>
          <input id="reference-file" type="file" accept=".csv,text/csv" aria-label="Engagement CSV" hidden>
        </details>
      </div>
    </form>
    <section class="results" aria-labelledby="results-heading">
      <div class="results-header">
        <div class="title-line"><h2 id="results-heading" aria-live="polite">Results</h2><span id="status-tag" hidden></span></div>
        <div class="views" role="group" aria-label="Result view" id="views" hidden>
          <button type="button" id="summary-view" aria-pressed="true">Match summary</button>
          <button type="button" id="all-view" aria-pressed="false">All columns</button>
        </div>
      </div>
      <p id="message" class="notice" role="status" aria-live="polite">Type a supplier name and press Enter.</p>
      <p id="query-meta" class="query-meta" hidden></p>
      <div id="table-window" class="table-window" role="region" tabindex="0" aria-label="Finding result rows" hidden>
        <table id="table"><caption class="sr-only">Finding output</caption><thead><tr id="columns"></tr></thead><tbody id="rows"></tbody></table>
      </div>
      <div class="page-bar" id="page-bar" hidden>
        <button class="page-button" type="button" id="prev">← Previous</button>
        <span id="page-label"></span>
        <button class="page-button" type="button" id="next">Next →</button>
      </div>
    </section>
    <noscript>Enable JavaScript to run Finding.</noscript>
  </main>
  <script>
    (() => {
      const el = id => document.getElementById(id);
      const input = el('supplier');
      const fileInput = el('reference-file');
      const pageSize = 50;
      const isLocalFile = location.protocol === 'file:';
      let defaultLocation = 'data/input/ENG_ALL.csv';
      let request;
      let result;
      let page = 0;
      let allColumns = false;

      function notify(text, error = false) {
        el('message').hidden = !text;
        el('message').textContent = text;
        el('message').classList.toggle('error', error);
      }

      function chosenFile() {
        return fileInput.files[0];
      }

      function syncForm() {
        const file = chosenFile();
        el('source-name').textContent = file ? file.name : defaultLocation;
        el('reset-file').hidden = !file;
        el('run').disabled = !input.value.trim() || !!request || !!(file && !/\.csv$/i.test(file.name));
        el('run').firstElementChild.textContent = request ? 'Searching…' : 'Run Finding';
        el('form').setAttribute('aria-busy', String(!!request));
      }

      function clearResult() {
        request?.abort();
        request = null;
        result = null;
        page = 0;
        allColumns = false;
        el('results-heading').textContent = 'Results';
        for (const id of ['status-tag','views','query-meta','table-window','page-bar']) el(id).hidden = true;
        el('rows').replaceChildren();
        el('columns').replaceChildren();
        syncForm();
        if (chosenFile() && !/\.csv$/i.test(chosenFile().name)) notify('Choose a .csv engagement file.', true);
        else notify('Type a supplier name and press Enter.');
      }

      function drawTable() {
        const { headers, rows, columns } = result;
        const summary = [
          [columns.id, 'Engagement ID'], [columns.source_value, 'Matched source value'],
          [columns.method, 'Match type'], [columns.source_field, 'Matched field']
        ];
        const labels = allColumns ? headers : summary.map(column => column[1]);
        const indices = allColumns ? headers.map((_,index) => index) : summary.map(column => headers.indexOf(column[0]));
        const headings = document.createDocumentFragment();
        for (const name of labels) {
          const th = document.createElement('th');
          th.scope = 'col';
          th.textContent = name;
          headings.append(th);
        }
        el('columns').replaceChildren(headings);
        const fragment = document.createDocumentFragment();
        const start = page * pageSize;
        const end = Math.min(start + pageSize, rows.length);
        for (const values of rows.slice(start, end)) {
          const row = document.createElement('tr');
          for (const column of indices) {
            const cell = document.createElement('td');
            cell.textContent = values[column] ?? '';
            row.append(cell);
          }
          fragment.append(row);
        }
        el('rows').replaceChildren(fragment);
        el('table').className = allColumns ? 'raw' : 'summary';
        el('table-window').hidden = !rows.length;
        el('table-window').scrollTop = 0;
        el('table-window').scrollLeft = 0;
        el('prev').disabled = page === 0;
        el('next').disabled = end >= rows.length;
        el('page-bar').hidden = rows.length <= pageSize;
        el('page-label').textContent = (start + 1) + '–' + end + ' of ' + rows.length;
        el('summary-view').setAttribute('aria-pressed', String(!allColumns));
        el('all-view').setAttribute('aria-pressed', String(allColumns));
      }

      function showResult(data) {
        result = data;
        const matched = data.status === 'MATCHED';
        const count = data.match_count;
        allColumns = !matched;
        el('status-tag').textContent = data.status;
        el('status-tag').dataset.status = data.status;
        el('status-tag').hidden = false;
        el('views').hidden = !matched;
        el('results-heading').textContent = matched ? count + (count === 1 ? ' candidate' : ' candidates') : 'Results';
        const descriptions = {
          MATCHED: '',
          NO_MATCH: 'No matching engagement was found in this reference.',
          INVALID_NAME: 'No searchable name remains after cleaning and alias replacement.',
          SKIPPED: 'Finding skips blank names and the whole name Unknown.'
        };
        notify(descriptions[data.status]);
        const details = ['Supplier: ' + data.supplier_name];
        if (data.search_name) details.push('Search name: ' + data.search_name);
        details.push('Reference: ' + data.reference);
        el('query-meta').textContent = details.join('   ·   ');
        el('query-meta').hidden = false;
        drawTable();
      }

      async function search(event) {
        event.preventDefault();
        if (el('run').disabled) return;
        if (isLocalFile) {
          // A direct HTML opening hands the pending search to the same local frontend.
          const address = new URL('http://127.0.0.1:8765/');
          address.hash = new URLSearchParams({ supplier: input.value }).toString();
          location.replace(address);
          return;
        }
        clearResult();
        const current = new AbortController();
        request = current;
        syncForm();
        notify('Searching the engagement register…');
        try {
          const file = chosenFile();
          const headers = { 'X-Supplier-Name': encodeURIComponent(input.value) };
          if (file) headers['X-Reference-Name'] = encodeURIComponent(file.name);
          const response = await fetch('/api/search', { method: 'POST', headers, body: file || null, signal: current.signal });
          const json = await response.json();
          if (request !== current) return;
          if (!response.ok) throw new Error(json.error || 'Finding could not complete the search.');
          showResult(json);
        } catch (error) {
          if (request === current && !current.signal.aborted) {
            notify(error instanceof SyntaxError || error instanceof TypeError ? 'Could not read a response from the local server.' : error.message, true);
          }
        } finally {
          if (request === current) {
            request = null;
            syncForm();
            if (document.activeElement === input) input.select();
          }
        }
      }

      async function displayReference() {
        try {
          const response = await fetch('/api/reference', { cache: 'no-store' });
          if (!response.ok) return;
          const info = await response.json();
          defaultLocation = info.location || defaultLocation;
          syncForm();
        } catch {
          // The search endpoint reads the project file anew on each submission.
        }
      }

      el('form').addEventListener('submit', search);
      el('pick').addEventListener('click', () => fileInput.click());
      el('reset-file').addEventListener('click', () => { fileInput.value = ''; clearResult(); });
      fileInput.addEventListener('change', clearResult);
      input.addEventListener('input', clearResult);
      el('summary-view').addEventListener('click', () => { allColumns = false; drawTable(); });
      el('all-view').addEventListener('click', () => { allColumns = true; drawTable(); });
      el('prev').addEventListener('click', () => { page--; drawTable(); });
      el('next').addEventListener('click', () => { page++; drawTable(); });
      el('source-options').hidden = isLocalFile;
      syncForm();
      if (!isLocalFile) {
        displayReference();
        const pendingName = new URLSearchParams(location.hash.slice(1)).get('supplier');
        if (pendingName !== null) {
          history.replaceState(null, '', location.pathname);
          input.value = pendingName;
          syncForm();
          if (pendingName.trim()) el('form').requestSubmit();
        }
      }
    })();
  </script>
</body>
</html>
